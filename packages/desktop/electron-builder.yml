appId: com.pavilionmfe.desktop
productName: PavilionMfe Desktop
directories:
  output: release
  buildResources: resources
files:
  - dist/main.js
  - dist/preload.js
  - package.json
extraResources:
  - from: dist/renderer
    to: renderer
    filter: ["**/*"]
mac:
  target:
    - dir
    - dmg
  category: public.app-category.developer-tools
# win:
#   target:
#     - nsis
#   artifactName: ${productName}-${version}-${arch}.${ext}
# linux:
#   target:
#     - AppImage
#     - deb
#   category: Development
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
