name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务运行
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core packages
        run: |
          pnpm --filter @pavilion-mfe/sandbox build
          pnpm --filter @pavilion-mfe/bridge build
          pnpm --filter @pavilion-mfe/router build
          pnpm --filter @pavilion-mfe/tabs build
          pnpm --filter @pavilion-mfe/runtime build
          pnpm --filter @pavilion-mfe/vite build

      - name: Generate Prisma Client
        run: pnpm --filter @pavilion-mfe/llm-gateway prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pavilion_mfe?schema=public

      - name: Quality check
        run: pnpm check

      - name: Build sub-apps
        run: |
          pnpm --filter git-report-generator build
        env:
          VITE_PAVILION_MFE_CDN: ${{ vars.PAVILION_MFE_CDN || '/pavilion-mfe' }}

      - name: Build main app
        run: pnpm --filter main-app build
        env:
          VITE_PAVILION_MFE_CDN: ${{ vars.PAVILION_MFE_CDN || '/pavilion-mfe' }}
          VITE_DEPLOY_BASE: ${{ vars.VITE_DEPLOY_BASE || '/pavilion-mfe/' }}

      - name: Collect dist artifacts
        run: |
          mkdir -p dist-ghpages/mfe/git-report-generator

          # 主应用 → 根目录
          cp -r apps/main-app/dist/* dist-ghpages/

          # 子应用 → /mfe/<appCode>/
          cp -r apps/git-report-generator/dist/* dist-ghpages/mfe/git-report-generator/

          # SPA 降级处理：保存完整路径 → 重定向到基础 URL
          cat > dist-ghpages/404.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><script>
          var segs = location.pathname.split('/');
          sessionStorage.setItem('pavilion-redirect', location.pathname + location.search + location.hash);
          location.replace('/' + segs[1] + '/');
          </script></head><body>Redirecting...</body></html>
          HTMLEOF

          echo "=== Deployment structure ==="
          find dist-ghpages -maxdepth 3 -type f | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-ghpages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
